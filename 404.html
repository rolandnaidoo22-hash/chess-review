<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unavailable</title>
<h2 style="font-family:sans-serif;text-align:center;margin-top:30vh">This app is no longer available.</h2>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));}if(window.caches)caches.keys().then(k=>k.forEach(n=>caches.delete(n)));try{localStorage.clear()}catch(e){}</script>
